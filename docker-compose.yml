services:
  ha-3d-home:
    build: .
    # 构建镜像发布后可改为 image: your-registry/ha-3d-home:latest
    image: ha-3d-home:latest
    container_name: ha-3d-home
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data      # 连接配置 + 户型项目 + 贴图（首启自动写入默认 config.json / project.json）
      - ./custom:/custom  # 用户自定义模型与插件（结构同 assets: models/ plugins/ catalog.json），升级不丢
                          # 内置 assets 不挂载，直接用镜像自带的，升级镜像即升级资产
    environment:
      NODE_ENV: production  # 生产模式：不打印日志
      HA3D_LOG: "0"         # 需要排查时改成 "1" 打开日志
      PORT: 8099
      HA3D_DATA_DIR: /data  # 挂载点路径；内置 assets/seed 走镜像内相对路径默认值，无需配置
      # 插件远程安装密钥（studio 一键发布用）。设了就以此为准，页面里不能再改：
      # HA3D_INSTALL_KEY: "换成你自己的随机串"
    mem_limit: 128m         # 内存上限（实际占用约 40-60MB）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
